# 子霖宝石助手 —— Nginx 站点配置模板
# 使用方式：把 __DOMAIN__ 换成你的二级域名（如 gem.yourdomain.com），__ROOT__ 换成站点目录
# 放置到 /etc/nginx/conf.d/gem.conf（CentOS/TencentOS）或 /etc/nginx/sites-available/gem（Ubuntu）

# HTTP 全部跳转 HTTPS
server {
    listen 80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    # 证书（腾讯云可申请免费 SSL，下载 Nginx 版本证书放到该路径）
    ssl_certificate     /etc/nginx/ssl/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root __ROOT__;
    index index.html;

    # 静态站点：PWA 资源不做长时间缓存，保证每次打开都是最新版
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(png|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 云同步代理：WorkBuddy 云接口只接受官方域名的来源，
    # 这里把 /.cloud/ 转发到官方域名，并改写 Origin/Referer 与 CORS 响应头，
    # 使页面在自己的域名下也能正常读写云端数据。
    location ^~ /.cloud/ {
        proxy_pass https://zilin-gem-helper.app.workbuddy.host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host zilin-gem-helper.app.workbuddy.host;
        proxy_set_header Origin https://zilin-gem-helper.app.workbuddy.host;
        proxy_set_header Referer https://zilin-gem-helper.app.workbuddy.host/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 把 CORS 响应改回本站来源，否则浏览器会拦截跨域响应
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-wb-webapp-access-key, x-client-info, x-workbuddy-publishable-key, prefer, accept, accept-profile, content-profile" always;
        add_header Access-Control-Expose-Headers "content-range, content-location, x-total-count" always;
        add_header Access-Control-Max-Age 86400 always;

        # 预检请求直接放行
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
